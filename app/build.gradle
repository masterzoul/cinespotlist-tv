plugins {
    id 'com.android.application'
}

android {
    namespace 'com.masterzoul.cinespotlisttv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.masterzoul.cinespotlisttv.sonyfive'
        minSdk 23
        targetSdk 35
        versionCode 21
        versionName '4.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
